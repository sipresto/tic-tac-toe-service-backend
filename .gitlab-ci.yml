stages:
  - compile
  - package

variables:
  DEFAULT_IMAGE_NAME: eclipse-temurin:21-jdk-alpine
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key:
    files:
      - pom.xml
  paths:
    - .m2/repository

compile-job:
  stage: compile
  image: $DEFAULT_IMAGE_NAME
  before_script:
    - chmod +x ./mvnw
  script:
    - ./mvnw compile
  artifacts:
    paths:
      - target/
    expire_in: 1 day

maven-package-job:
  stage: package
  image: $DEFAULT_IMAGE_NAME
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk update && apk add --no-cache docker
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - chmod +x ./mvnw
  script:
    - >
      ./mvnw spring-boot:build-image
      -Dimage=$CI_REGISTRY_IMAGE/tic-tac-toe-service-backend:0.0.1-SNAPSHOT
      -DskipTests
      -Dspring-boot.build-image.environment=SPRING_PROFILES_ACTIVE=deploy
    - docker tag tic-tac-toe-service-backend:0.0.1-SNAPSHOT $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: '$CI_COMMIT_TAG'
