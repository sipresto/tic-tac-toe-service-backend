spring.application.name=Tic Tac Toe Service Backend

server.port=8096

spring.datasource.url=jdbc:postgresql://localhost:5544/platformdb?currentSchema=tic_tac_toe
spring.datasource.username=platform
spring.datasource.password=platformSecretPassword

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

logging.level.sql=DEBUG
logging.level.web=DEBUG

ai.service.url=http://localhost:8000/games/tic-tac-toe/best-move
finished.cutoff.minutes=15
abandoned.cutoff.minutes=2