spring.application.name=Tic Tac Toe Service Backend
server.port=8096

spring.datasource.url=jdbc:postgresql://app_postgres:5432/platformdb?currentSchema=tic_tac_toe
spring.datasource.username=platform
spring.datasource.password=platformSecretPassword
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.rabbitmq.host=app_rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

ai.service.url=http://ai_player:8000/games/tic-tac-toe/best-move

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://idp-keycloak:8080/auth/realms/game_platform
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://idp-keycloak:8080/auth/realms/game_platform/protocol/openid-connect/certs
app.auth.valid-issuers=http://localhost/auth/realms/game_platform,http://idp-keycloak:8080/auth/realms/game_platform

frontend.url=/games/tictactoe
backend.url=/api/games/tictactoe
