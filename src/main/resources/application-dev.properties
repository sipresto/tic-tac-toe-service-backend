spring.application.name=Tic Tac Toe Service Backend
server.port=8096

spring.datasource.url=jdbc:postgresql://localhost:5544/platformdb?currentSchema=tic_tac_toe
spring.datasource.username=platform
spring.datasource.password=platformSecretPassword
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5772
spring.rabbitmq.username=user
spring.rabbitmq.password=password

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

ai.service.url=http://localhost:8000/games/tic-tac-toe/best-move

game.base-url=http://localhost:5174/games/tictactoe/

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8280/auth/realms/game_platform/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8280/auth/realms/game_platform
app.auth.valid-issuers=http://localhost:8280/auth/realms/game_platform,http://idp-keycloak:8080/auth/realms/game_platform