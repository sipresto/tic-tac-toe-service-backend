spring.application.name=Game Platform Service Backend
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
server.port=8080
spring.rabbitmq.host=app_rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
server.forward-headers-strategy=framework
spring.datasource.url=jdbc:postgresql://app_postgres:5432/platformdb?currentSchema=game_platform
spring.datasource.username=platform
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:sql/data.sql
spring.datasource.password=${DB_PASSWORD}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
app.services.platform.client-secret=${APP_SERVICES_PLATFORM_CLIENT_SECRET}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://samenbeslist.be/auth/realms/game_platform
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://samenbeslist.be/auth/realms/game_platform/protocol/openid-connect/certs
app.auth.valid-issuers=https://samenbeslist.be/auth/realms/game_platform,http://idp-keycloak:8080/auth/realms/game_platform

frontend.url=https://samenbeslist.be/games/tictactoe
backend.url=http://tic-tac-toe-backend:8080/api/games/tictactoe

